[project]
name = "invoicing-backend"
version = "0.1.0"
description = "Django + Ninja API for the service invoicing app"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2.18,<5.3",
    "django-environ>=0.14",
    "django-ninja>=1.7.1",
    "gunicorn>=26.2",
    "psycopg[binary]>=3.3.6",
    "whitenoise>=6.12",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=5.2.9,<5.3",
    "pytest>=9.1",
    "pytest-django>=4.14",
    "ruff>=0.17",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
addopts = "--reuse-db"
testpaths = ["tests"]
# Warnings fail tests so deprecations surface early; WhiteNoise's missing-STATIC_ROOT notice is expected
filterwarnings = [
    "error",
    "ignore:No directory at:UserWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, Django, Bandit security
select = ["E", "F", "I", "B", "UP", "DJ", "S"]

[tool.ruff.lint.per-file-ignores]
# pytest relies on bare assert
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main"]

# django-environ ships no type hints; settings values are checked through the Django plugin
[[tool.mypy.overrides]]
module = ["environ"]
ignore_missing_imports = true

[tool.django-stubs]
# Plugin imports settings, so DJANGO_SECRET_KEY and DATABASE_URL must be set when mypy runs
django_settings_module = "config.settings"
