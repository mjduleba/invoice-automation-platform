# Weekly dependency updates (NFR-07); minor and patch bumps are grouped to one PR per ecosystem.
version: 2
updates:
  # Backend Python packages from uv.lock
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python-minor:
        update-types: [minor, patch]

  # Frontend npm packages
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor:
        update-types: [minor, patch]

  # SHA-pinned actions in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]

  # Base images in the Dockerfile
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # Postgres, Node and Mailpit images in compose.yaml
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
